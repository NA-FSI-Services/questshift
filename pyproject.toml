[project]
name = "questshift-docs"
version = "0.1.0"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov=tools --cov-branch --cov-report=term-missing --cov-report=html --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["tools"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
